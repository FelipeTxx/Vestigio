<ion-content class="diary-content" [fullscreen]="true">
  <div class="diary-page" [class.writer-mode]="view === 'writer'">
    <app-diarios-list
      *ngIf="view === 'roadmap'"
      [pages]="pageCards"
      [currentStreak]="currentStreak"
      (pageSelected)="openDiary($event.diary)"
      (addPage)="addDiary()">
    </app-diarios-list>

    <ng-container *ngIf="selectedDiary as diary">
      <app-diario-pagina
        [diary]="diary"
        [editor]="editor"
        [pageNumber]="selectedPageNumber"
        [typography]="typography"
        [caption]="editorCaption"
        [formattedDate]="diary.created_at ? formattedDate(diary.created_at) : ''"
        [canDelete]="selectedDiaryId !== null"
        (returnToPages)="returnToRoadmap()"
        (deletePage)="deleteSelectedDiary()"
        (titleChanged)="updateTitle($event)"
        (bold)="toggleBold()"
        (italic)="toggleItalic()"
        (heading)="toggleHeading()"
        (bulletList)="toggleBulletList()"
        (blockquote)="toggleBlockquote()">
      </app-diario-pagina>
    </ng-container>
  </div>
</ion-content>
