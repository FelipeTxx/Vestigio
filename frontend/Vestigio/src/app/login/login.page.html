<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>
    <ion-row *ngIf="log_in" style="margin-top: 20px;" class="ion-justify-content-center">
      <ion-col size="5" class="standart-box ion-justify-content-center">
        <ion-row class="ion-text-center">
          <ion-col size="12">
            Login
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="14">
            <ion-input label="Nome" [(ngModel)]="user.name" label-placement="floating" fill="outline" placeholder="Enter text"></ion-input>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="14">
            <ion-input label="Email" [(ngModel)]="user.email" label-placement="floating" fill="outline" placeholder="Enter text"></ion-input>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="14">
            <ion-input label="Senha" [(ngModel)]="user.password" label-placement="floating" fill="outline" placeholder="Enter text"></ion-input>
          </ion-col>
        </ion-row>
        <ion-row class="ion-text-center">
          <ion-col size="14">
            <ion-button (click)="store()" fill="outline">Cadastrar</ion-button>
          </ion-col>
          <ion-col size="14">
            <a style="cursor: pointer; font-size: 12px;" (click)="sign_in = true; log_in = false;">não tem uma conta? Cadastrar-se!</a>
          </ion-col>
        </ion-row>
      </ion-col>
  </ion-row>
    <ion-row *ngIf="sign_in" style="margin-top: 20px;" class="ion-justify-content-center">
      <ion-col size="5" class="standart-box ion-justify-content-center">
        <ion-row class="ion-text-center">
          <ion-col size="12">
            Login
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="14">
            <ion-input label="Email" [(ngModel)]="user.email" label-placement="floating" fill="outline" placeholder="Enter text"></ion-input>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="14">
            <ion-input label="Senha" [(ngModel)]="user.password" label-placement="floating" fill="outline" placeholder="Enter text"></ion-input>
          </ion-col>
        </ion-row>
        <ion-row class="ion-text-center">
          <ion-col size="14">
            <ion-button (click)="log()" fill="outline">Logar</ion-button>
          </ion-col>
          <ion-col size="14">
            <a style="cursor: pointer; font-size: 12px;" (click)="sign_in = false; log_in = true;">Já tem uma conta? Entre!</a>
          </ion-col>
        </ion-row>
      </ion-col>
  </ion-row>
</ion-content>
